<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groupe Zamu</title>
<meta property="og:title" content="Rejoins mon groupe sur Zamu">
<meta property="og:description" content="Un petit groupe privé de 6 personnes au plus.">
<style>
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
         background: #0d0b16; color: #fff; text-align: center; padding: 64px 16px; }
  a.bouton { display: inline-block; margin-top: 18px; padding: 15px 28px; border-radius: 999px;
             background: linear-gradient(90deg, #8c46f0, #d94bc8); color: #fff;
             font-weight: 800; text-decoration: none; }
  p { color: #b9b2cc; }
</style>
</head>
<body>
  <h1>Zamu</h1>
  <p id="texte">Ouverture du groupe…</p>
  <a class="bouton" id="ouvrir" href="#">Rejoindre dans Zamu</a>
  <p><a href="https://play.google.com/store/apps/details?id=com.vybestyle.zamu" style="color:#b9b2cc">Pas encore Zamu ? Télécharger sur Google Play</a></p>
<script>
  // Invitation de groupe : ouvre zamu://groupe/<code> sur Android, sinon le Play Store
  var play = 'https://play.google.com/store/apps/details?id=com.vybestyle.zamu';
  var c = new URLSearchParams(location.search).get('c') || '';
  var valide = /^[A-Za-z0-9]{6,32}$/.test(c);
  var lien = valide
    ? 'intent://groupe/' + c + '#Intent;scheme=zamu;package=com.vybestyle.zamu;S.browser_fallback_url=' + encodeURIComponent(play) + ';end'
    : play;
  document.getElementById('ouvrir').href = lien;
  if (/android/i.test(navigator.userAgent)) { location.href = lien; }
  else { document.getElementById('texte').textContent = 'Zamu est disponible sur Android.'; }
</script>
</body>
</html>
